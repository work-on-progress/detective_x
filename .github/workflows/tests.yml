name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Confirm every case is still solvable
        run: python tools/verify.py

      - name: Confirm the case data matches its source
        run: |
          python tools/build_cases.py
          python tools/build_manifest.py
          git diff --exit-code -- detective_x/data/cases manifest.json \
            || (echo "::error::Case data is out of date. Run tools/build_cases.py and commit." && exit 1)
